<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JDP SISTEMAS — SOBERANO UNIFIED MANAGER</title>
    <link rel="icon" href="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1784354008520_icon_192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617; /* Fundo Preto Industrial HELENA */
        }
        /* ESCUDO DE PROTEÇÃO E CARREGAMENTO HELENA */
        #helena-shield {
            position: fixed;
            inset: 0;
            background-color: #020617;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            font-family: 'Courier New', Courier, monospace;
            color: #06b6d4; /* Cyan HELENA */
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(6, 182, 212, 0.1);
            border-top: 3px solid #fde047; /* Amarelo Mestre José */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(253, 224, 71, 0.2);
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            letter-spacing: 3px;
            font-weight: bold;
            font-size: 0.9rem;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Escudo de Inicialização Ativo -->
    <div id="helena-shield">
        <div class="spinner"></div>
        <div class="loading-text">CONECTANDO AO NÚCLEO SOBERANO</div>
        <p style="font-size: 0.7rem; color: #fde047; margin-top: 8px; letter-spacing: 1px;">SISTEMA SEGURO: PRINCESA DIAMANTE</p>
    </div>

    <!-- Canal de Transmissão Direto da Máquina Superior da Render -->
    <iframe 
        id="engine-frame" 
        src="https://jdp-sistemas.onrender.com" 
        allow="geolocation; microphone; camera; midi; vr; accelerometer; gyroscope; payment; decrypt-renderer" 
        sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"
        onload="dismissShield()">
    </iframe>

    <script>
        // Desativa o escudo de segurança assim que a máquina Render estiver conectada
        function dismissShield() {
            const shield = document.getElementById('helena-shield');
            shield.style.transition = 'opacity 0.5s ease';
            shield.style.opacity = '0';
            setTimeout(() => {
                shield.style.display = 'none';
            }, 500);
        }
    </script>
</body>
</html>
