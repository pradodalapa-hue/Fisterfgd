<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>SISTEMA JDP - JK</title>
    <style>
        body { background:#000; color:#fff; font-family:monospace; margin:0; overflow:hidden; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; }
        #term { width:80%; text-align:left; font-size:18px; color:#0f0; text-shadow:0 0 5px #0f0; }
        #muralha { display:none; text-align:center; animation: fadeIn 2s; }
        .logo { width:150px; filter:drop-shadow(0 0 10px #fde047); margin-bottom:20px; }
        .btn-w { display:inline-block; margin-top:20px; padding:15px 30px; background:#25d366; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; font-family:sans-serif; }
        @keyframes fadeIn { from {opacity:0} to {opacity:1} }
    </style>
</head>
<body>
    <div id="term"></div>
    <div id="muralha">
        <img class="logo" src="https://raw.githubusercontent.com/pradodalapa-hue/fotos-industrial/main/img/jdp_1777000164292_icon_512_1_.png">
        <h2 style="color:#fde047">ACESSO BLOQUEADO</h2>
        <p>DISPOSITIVO OU DIRETÓRIO DE EXECUÇÃO NÃO AUTORIZADO PELO SISTEMA.</p>
        <a href="https://wa.me/5592984846058" class="btn-w">FALAR COM MESTRE JOSÉ</a>
    </div>
    <script>
        const C = { id:'JK', k:'SksxNzg1MzI0NzM4', folder: '/clientes/jk/' };
        const t = document.getElementById('term');
        const m = document.getElementById('muralha');
        
        const msg = [
            "> ACESSANDO KERNEL JDP...",
            "> CONECTANDO AO SERVIDOR SEGURO...",
            "> ANALISANDO DIRETÓRIO DE EXECUÇÃO...",
            "> VERIFICANDO INTEGRIDADE DO DOMÍNIO...",
            "> CARREGANDO REQUISITOS..."
        ];
        let l=0, c=0;

        function type() {
            if(l < msg.length) {
                if(c < msg[l].length) { t.innerHTML += msg[l].charAt(c); c++; setTimeout(type, 30); }
                else { t.innerHTML += "<br>"; l++; c=0; setTimeout(type, 400); }
            } else {
                setTimeout(() => { t.style.display='none'; m.style.display='block'; }, 1000);
            }
        }

        async function validar() {
            const host = window.location.hostname;
            const path = window.location.pathname.toLowerCase();
            
            // 1. Validação de Domínio (Permite o oficial ou ambiente de teste local do Mestre)
            const isDomainValid = host === 'jdpsistemas.com.br' || host === 'localhost' || host === '127.0.0.1';
            
            // 2. Validação Estrita de Caminho (Evita rodar fora da subpasta correta do cliente)
            const isPathValid = path.includes(C.folder) || host === 'localhost' || host === '127.0.0.1';
            
            if(!isDomainValid || !isPathValid) {
                msg.push("> ERRO CRÍTICO: VIOLAÇÃO DE DIRETÓRIO OU DOMÍNIO RESTRITO!");
                msg.push("> BLOQUEIO REMOTO EXECUTADO COM SUCESSO.");
                type();
                return;
            }
            
            try {
                // Helena valida a licença do banco de dados no GitHub central
                const r = await fetch('https://raw.githubusercontent.com/pradodalapa-hue/Fisterfgd/main/clientes.json?t='+Date.now());
                const d = await r.json();
                const u = d.find(i => i.id === C.id && i.apiKey === C.k);
                
                if(u && u.status === 'ativo') {
                    // Busca o payload de dentro da pasta correta do cliente de forma relativa
                    const r2 = await fetch('./payload.json?t='+Date.now());
                    const p = await r2.json();
                    document.open();
                    document.write(decodeURIComponent(escape(atob(p.payload))));
                    document.close();
                } else {
                    msg.push("> ERRO: LICENÇA EXPIRADA OU DESATIVADA PELO MESTRE.");
                    type();
                }
            } catch(e) {
                msg.push("> ERRO DE CONEXÃO: FALHA AO AUTENTICAR NO SERVIDOR PRINCIPAL.");
                type();
            }
        }

        if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
        validar();
    </script>
</body>
</html>
